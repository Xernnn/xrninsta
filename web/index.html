<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- The proxy may strip the mount path, so relative URLs hang off this. -->
  <base href="/xrninsta/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>xrninsta</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <form id="signin" class="signin" hidden>
    <img class="logo" src="icon.svg" alt="" width="40" height="40">
    <h1>xrninsta</h1>
    <label>Name <input name="user" autocomplete="username" required></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button class="primary">Sign in</button>
    <p class="error" id="signin-error" hidden></p>
  </form>

  <div id="failed" class="signin" hidden>
    <img class="logo" src="icon.svg" alt="" width="40" height="40">
    <h1>xrninsta</h1>
    <p class="error" id="failed-label" role="alert"></p>
    <button type="button" class="primary" id="retry">Retry</button>
  </div>

  <div id="app" hidden>
    <header class="top">
      <img class="logo" src="icon.svg" alt="" width="24" height="24">
      <h1>xrninsta</h1>
      <span class="muted" id="counts"></span>
      <span class="spacer"></span>
      <!-- Find, for every tab: the Dashboard's artists, Songs and OnHold. / or Ctrl+F comes here. -->
      <label class="find-all"><span class="visually-hidden">Find</span><input id="find" type="search" placeholder="Find" autocomplete="off" title="Find (/ or Ctrl+F)"></label>
      <button id="signout" class="quiet small">Sign out</button>
    </header>
    <p class="banner" id="bot" hidden></p>

    <main class="sheets">
      <!-- Dashboard: the sheet's own layout. Its title and control cells stay put like the
           sheet's frozen rows; the artists scroll under them with the summary beside. -->
      <section id="tab-artists" class="tab" role="tabpanel" aria-labelledby="tab-btn-artists">
        <div class="frozen">
          <h2 class="sheet-title">Music Dashboard</h2>
          <div class="cells">
            <label class="cell pick"><span class="cell-head">Genre Filter</span><select id="artist-genre"></select></label>
            <label class="cell pick"><span class="cell-head">Sort Day</span><select id="artist-sort">
              <option value="new">Newest first</option>
              <option value="old">Oldest first</option>
            </select></label>
          </div>
        </div>
        <div class="scroll">
          <div class="dash">
            <table id="artists" class="sheet artists">
              <colgroup><col class="c-indent"><col><col class="c-day"></colgroup>
              <thead><tr class="head"><th scope="col">Artist</th><th scope="col">Title</th><th scope="col" class="day">Day</th></tr></thead>
            </table>
            <aside id="summary" class="summary" aria-label="Summary"></aside>
          </div>
        </div>
      </section>

      <!-- Songs: the sheet's columns. The yellow row under the header is the next empty row. -->
      <section id="tab-songs" class="tab" role="tabpanel" aria-labelledby="tab-btn-songs" hidden>
        <div class="frozen">
          <div class="cells">
            <label class="cell pick"><span class="cell-head">Genre Filter</span><select id="song-genre"></select></label>
            <label class="cell pick"><span class="cell-head">Sort Day</span><select id="song-sort">
              <option value="new">Newest first</option>
              <option value="old">Oldest first</option>
            </select></label>
            <p class="count muted"><span id="song-count"></span></p>
          </div>
        </div>
        <div class="scroll">
          <table class="sheet songs">
            <colgroup><col><col><col class="c-day"><col class="c-genre"><col class="c-act"></colgroup>
            <thead><tr class="head">
              <th scope="col">Title</th><th scope="col">Artist(s)</th><th scope="col" class="num"><span class="long">Day No</span><span class="short">Day</span></th><th scope="col">Genre</th><th scope="col" class="act"><span class="sr">Fix</span></th>
            </tr></thead>
            <tbody class="new">
              <tr><td colspan="5">
                <button type="button" class="opener" aria-controls="add-song" aria-expanded="false">+ Add a song</button>
                <form id="add-song" class="rowform" aria-label="Add a song">
                  <label><span class="f-label">Title</span><input name="title" placeholder="Title" required maxlength="200"></label>
                  <label><span class="f-label">Artist(s)</span><input name="artists" placeholder="Artist(s)" required maxlength="300"></label>
                  <label class="third"><span class="f-label">Day No</span><input name="day" type="number" step="1" inputmode="numeric"></label>
                  <label class="third"><span class="f-label">Genre</span><select name="genre" required></select></label>
                  <span class="go third"><button class="primary small">Add</button></span>
                </form>
              </td></tr>
            </tbody>
            <tbody id="songs"></tbody>
          </table>
        </div>
      </section>

      <section id="tab-holds" class="tab" role="tabpanel" aria-labelledby="tab-btn-holds" hidden>
        <div class="frozen slim"><p class="count muted"><span id="hold-count"></span></p></div>
        <div class="scroll">
          <table class="sheet holds">
            <colgroup><col><col><col class="c-note"><col class="c-act"></colgroup>
            <thead><tr class="head">
              <th scope="col">Title</th><th scope="col">Artist(s)</th><th scope="col" class="note">Note</th><th scope="col" class="act"><span class="sr">Actions</span></th>
            </tr></thead>
            <tbody class="new">
              <tr><td colspan="4">
                <button type="button" class="opener" aria-controls="add-hold" aria-expanded="false">+ Put a song on hold</button>
                <form id="add-hold" class="rowform" aria-label="Put a song on hold">
                  <label><span class="f-label">Title</span><input name="title" placeholder="Title" required maxlength="200"></label>
                  <label class="third"><span class="f-label">Artist(s)</span><input name="artists" placeholder="Artist(s)" maxlength="300"></label>
                  <label class="third"><span class="f-label">Note</span><input name="note" placeholder="Note" maxlength="1000"></label>
                  <span class="go third"><button class="primary small">Hold</button></span>
                </form>
              </td></tr>
            </tbody>
            <tbody id="holds"></tbody>
          </table>
        </div>
      </section>
    </main>

    <!-- The sheet's tabs, along the bottom where the sheet had them. -->
    <nav class="tabs" role="tablist" aria-label="Sheets">
      <button role="tab" id="tab-btn-artists" data-tab="artists" aria-controls="tab-artists" aria-selected="true">Dashboard</button>
      <button role="tab" id="tab-btn-songs" data-tab="songs" aria-controls="tab-songs" aria-selected="false">Songs</button>
      <button role="tab" id="tab-btn-holds" data-tab="holds" aria-controls="tab-holds" aria-selected="false">OnHold</button>
    </nav>
  </div>
</body>
</html>
